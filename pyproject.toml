[project]
name = "arabiclegaldocumentproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MohamedSamy853", email = "mohamed.samy.2248369@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langdetect>=1.0.9",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "tqdm>=4.70.1",
    "openai",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "ragas>=0.4",
    "langchain-community<0.4.2",
    "vertexai>=1.71.1",
    "pillow>=12.3.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
build_index = "vectordb.build_index:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
namespace = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]


[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Start small: E/F = real errors, I = import sorting
select = ["E", "F", "I"]
