services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    volumes:
      - ./qdrant_storage:/qdrant/storage

  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    gpus: all
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: your_hf_token
    command:
      - --model
      - Qwen/Qwen3.5-2B
      - --dtype
      - bfloat16
      - --gpu-memory-utilization
      - "0.85"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "1024"
      - --max-model-len
      - "8192"

volumes:
  huggingface_cache:
