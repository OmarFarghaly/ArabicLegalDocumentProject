x-backend-image: &backend-image
  build:
    context: .
    dockerfile: Dockerfile
  image: arabic-legal-document-backend:local

services:
  indexer:
    <<: *backend-image
    command:
      - uv
      - run
      - --no-sync
      - python
      - docker/index_if_changed.py
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - index_state:/var/lib/index-state
      - model_cache:/root/.cache/huggingface
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "on-failure"
    networks:
      - app_network

  backend:
    <<: *backend-image
    gpus: all
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      LLM_BASE_URL: http://vllm:8000/v1
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - model_cache:/root/.cache/huggingface
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=10)"
      interval: 60s
      timeout: 30s
      retries: 20
      start_period: 600s
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r response <&3
          [[ "$$response" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app_network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network

  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    gpus: all
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - vllm_cache:/root/.cache/vllm
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - Qwen/Qwen3-2B
      - --dtype
      - bfloat16
      - --gpu-memory-utilization
      - "0.82"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "4096"
      - --max-model-len
      - "8192"
      - --enable-prefix-caching
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - http://127.0.0.1:8000/health
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    depends_on:
      indexer:
        condition: service_completed_successfully
    networks:
      - app_network

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    environment:
      # Do not use `command:` with redis-stack, it disables the modules.
      REDIS_ARGS: "--maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - app_network

volumes:
  huggingface_cache:
  model_cache:
  redis_data:
  index_state:
  vllm_cache:

networks:
  app_network:
    driver: bridge
